# Little Browser CI/CD: GitLab hosting and CI, on the project's own AWS account, with macOS builds
# on Macs of our own.
# Release pipeline: docs/design.md §14.
#
# Runners: this project's own, in the Little Browser AWS account, managed by the
# infrastructure repository. Shared and group runners are disabled for this project.
#   lb-linux                small Linux Spot: quick checks, patch-check, release bot
#   lb-linux-protected      small Linux Spot, protected refs only; release role (downloads, the EC2 Mac)
#   lb-linux-build          64 vCPU x64 Linux Spot, 300 GB: merge-request builds, Android
#   lb-linux-release        same, protected refs only: release builds, signing secrets
#   lb-linux-arm64-build    64 vCPU Graviton Linux Spot, 300 GB: arm64 builds for merge requests
#   lb-linux-arm64-release  same, protected refs only
#   lb-windows-build        64 vCPU Windows Spot (instance executor): merge-request builds        (later)
#   lb-windows-release      same, protected refs only                                             (later)
#   lb-macos-arm64          an Apple silicon Mac of our own (shell executor), protected refs
#   lb-macos-x64            an Intel Mac of our own (shell executor), protected refs
#   lb-macos                EC2 Mac host allocated per release (macos-arm64-host job), protected refs;
#                           paused while LB_MACOS_HOST is "local". It carries lb-macos-arm64 too, so the
#                           arm64 jobs run on it instead when it is back.
# CI/CD variables LB_SCCACHE_BUCKET, LB_AWS_REGION and LB_MACOS_* come from the infrastructure repository too:
# LB_MACOS_HOST ("local" or "ec2") says where macOS builds run, LB_MACOS_SIGNING_ROLE_ARN is the role
# our own Macs sign with (through a GitLab ID token; they have no AWS credentials of their own).
#
# Compiler cache: sccache via GN cc_wrapper, keyed by file content. S3 bucket shared by the
# spot instances; local disk on the macOS runners.
#
# Release automation: the infrastructure repository also creates the release-bot
# token (LB_BOT_TOKEN, masked and protected), the upstream-watch schedule (LB_SCHEDULE) and
# the protection on main and v* tags.
#
# Of the Chromium build jobs, only the Android ones have run; the macOS ones haven't run yet.

stages: [check, provision, build, package, publish]

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"
      when: never                # the merge request pipeline covers it
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

# ------------------------------------------------------------------ fast checks (every push)

.check:
  stage: check
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - when: on_success

core:
  extends: .check
  tags: [lb-linux]
  image: rust:1-slim
  before_script:
    - rustup component add clippy rustfmt
  script:
    - cd core
    - cargo fmt --check
    - cargo clippy --all-targets -- -D warnings
    - cargo test

# Gate: lb-core's tests must cover at least LB_MIN_LINE_COVERAGE percent of its lines.
core-coverage:
  extends: .check
  tags: [lb-linux]
  image: rust:1-slim
  variables:
    LB_MIN_LINE_COVERAGE: "95"
  before_script:
    - rustup component add llvm-tools
  script:
    - core/scripts/coverage.sh

# Gate: every source of chromium/lb's view-free model has unit tests (they run with the Chromium
# builds below, which build and run lb_unittests).
lb-tests:
  extends: .check
  tags: [lb-linux]
  image: python:3-slim
  script:
    - python3 -I chromium/scripts/check_lb_tests.py

# Unit tests of the release scripts (download counts, the update feed, release notes, publishing,
# GitLab's release).
script-tests:
  extends: .check
  tags: [lb-linux]
  image: python:3-slim
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git jq   # release notes', publish-release.sh's tests
  script:
    - python3 -I -m unittest discover -s chromium/scripts -p 'test_*.py'
    - python3 -I -m unittest discover -s desktop/scripts -p 'test_*.py'
    - python3 -I -m unittest discover -s android/scripts -p 'test_*.py'

scripts:
  extends: .check
  tags: [lb-linux]
  image: koalaman/shellcheck-alpine:stable
  script:
    - shellcheck chromium/scripts/*.sh desktop/scripts/*.sh desktop/platforms/*.sh core/scripts/*.sh android/scripts/*.sh   # also reports syntax errors; the image has no bash

# Gate: no patch for every platform mixes engine and view code, shared patches hold engine code
# only, and platform-only patches are tagged (desktop/patches/README.md).
patch-layers:
  extends: .check
  tags: [lb-linux]
  image: python:3-slim
  script:
    - python3 -I chromium/scripts/check_series.py

# The website's download logic (site/downloads.js): which build of which release it offers.
site-tests:
  extends: .check
  tags: [lb-linux]
  image: node:24-slim
  script:
    - node --test desktop/scripts/test_site_downloads.js

# Gate: the website's translations are complete and the translated copies in site/ are up to date
# (site/AGENTS.md).
site-i18n:
  extends: .check
  tags: [lb-linux]
  image: python:3-slim
  script:
    - python3 -I desktop/scripts/site_i18n.py check

# Every patch still applies: ungoogled-chromium, platform and our two series on a fresh
# Chromium tarball, for each desktop platform. No compile, so it is cheap enough for every bump or
# patch merge request.
patch-check:
  stage: check
  tags: [lb-linux]
  image: python:3-slim
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: [chromium/VERSIONS, chromium/patches/**/*, desktop/patches/**/*, desktop/platforms/**/*,
                chromium/scripts/lib.sh, chromium/scripts/check_patches.py, desktop/scripts/fetch.sh]
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git patch xz-utils ca-certificates
  script:
    - |
      for entry in desktop/platforms/*.sh; do
        desktop/scripts/fetch.sh --patches-only --platform "$(basename "$entry" .sh)"
        chromium/scripts/check_patches.py --platform "$(basename "$entry" .sh)"   # ours: no fuzz or offset
        rm -rf desktop/build/src
      done
  cache:
    key: chromium-download-cache
    paths: [desktop/build/download_cache]

# The same for Android, the shared series and then its own, on a sparse checkout of just the files
# they touch: seconds.
android-patch-check:
  stage: check
  tags: [lb-linux]
  image: alpine:3
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: [chromium/VERSIONS, chromium/patches/**/*, android/patches/**/*, android/scripts/fetch.sh,
                chromium/scripts/lib.sh]
  before_script:
    - apk add --no-cache bash git
  script:
    - android/scripts/fetch.sh --patches-only

# ------------------------------------------------------------------ release automation

.bot:
  stage: check
  tags: [lb-linux]
  image: alpine:3
  before_script:
    - apk add --no-cache bash git coreutils grep sed

# Scheduled: a newer ungoogled-chromium release opens a bump merge request for a person to merge.
upstream-watch:
  extends: .bot
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $LB_SCHEDULE == "upstream-watch"
  script:
    - desktop/scripts/release-bot.sh bump

# A merge that changes VERSIONS' pins tags the release; the tag pipeline builds and signs it.
# release-bot.sh tag compares the pins with the previous commit's, so a comment edit or a move
# tags nothing. A branch's first push (no previous commit) matches every `changes:` rule, so it
# never tags.
auto-tag:
  extends: .bot
  rules:
    - if: $CI_COMMIT_BEFORE_SHA == "0000000000000000000000000000000000000000"
      when: never
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: [chromium/VERSIONS]
  variables:
    GIT_DEPTH: 1
  script:
    - desktop/scripts/release-bot.sh tag

# ------------------------------------------------------------------ Chromium builds
# macOS: release tags only, one Mac per architecture, each building natively.
# Linux/Windows (later): every merge request plus release tags, on spot instances.
# A Chromium version bump is a near-full rebuild (hours on macOS); changes to our own code on the
# same version mostly hit the compiler cache.

.chromium:
  stage: build
  timeout: 8h
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+\.\d+-\d+$/
    - when: manual
      allow_failure: true

# Only with the EC2 Mac (LB_MACOS_HOST "ec2"): allocate (or reuse) its host for this release, start
# the builder on it, attach its data volume if one is configured. The arm64 jobs below wait in
# `pending` until its runner is online.
macos-arm64-host:
  stage: provision
  tags: [lb-linux-protected]
  image:
    name: public.ecr.aws/aws-cli/aws-cli:2.27.50
    entrypoint: [""]
  rules:
    - if: $LB_MACOS_HOST == "ec2" && $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+\.\d+-\d+$/
  timeout: 4h                    # a recycled host can scrub for a while before it takes an instance
  script:
    - desktop/scripts/macos-host.sh up

# A macOS build, natively on its architecture's Mac (LB_ARCH), so out/Default is that
# architecture's and its unit tests run there. The tree is fresh each release; the download cache
# (desktop/build, which the checkout's clean leaves alone) and the compiler cache (SCCACHE_DIR, set
# by the runner on the Mac's own disk) are kept.
.macos-chromium:
  extends: .chromium
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+\.\d+-\d+$/
  variables:
    GIT_DEPTH: 1
    GIT_CLEAN_FLAGS: -ffdx -e desktop/build/
    LB_CC_WRAPPER: sccache
  script:
    - rm -rf desktop/build/src
    - desktop/scripts/fetch.sh "$LB_ARCH"
    - desktop/scripts/build.sh "$LB_ARCH"
    - (cd desktop/build/src && ninja -C out/Default lb_unittests lb_core_unittests && out/Default/lb_unittests && out/Default/lb_core_unittests)

macos-arm64:
  extends: .macos-chromium
  tags: [lb-macos-arm64]
  needs: [{job: macos-arm64-host, optional: true}]   # there only with the EC2 Mac
  variables:
    LB_ARCH: arm64

# An Intel Mac builds far slower than Apple silicon: the timeout leaves room for a cold build.
macos-x64:
  extends: .macos-chromium
  tags: [lb-macos-x64]
  needs: []
  timeout: 16h
  variables:
    LB_ARCH: x64

# Chromium builds on the Linux build runners, for every Linux-hosted platform (Android now, Linux
# desktop later): a fresh ubuntu:24.04 container per job on a 64 vCPU spot host, the tools and
# sccache from desktop/scripts/linux-build-host.sh, and the compiler cache in S3 under the prefix
# the host's role may write. Merge requests and manual runs use lb-linux-build (sccache/mr/);
# release builds on protected refs extend .linux-chromium-release (lb-linux-release,
# sccache/release/), so a merge request can never plant objects a signed release links in. The
# -arm64 templates are the same on the Graviton runners, for builds made natively on arm64.
.linux-chromium:
  extends: .chromium
  tags: [lb-linux-build]
  image: ubuntu:24.04
  variables:
    GIT_DEPTH: 1
    LB_CC_WRAPPER: sccache
    SCCACHE_BUCKET: $LB_SCCACHE_BUCKET
    SCCACHE_REGION: $LB_AWS_REGION
    SCCACHE_S3_KEY_PREFIX: sccache/mr/
    SCCACHE_S3_SERVER_SIDE_ENCRYPTION: "true"
  before_script:
    - desktop/scripts/linux-build-host.sh

.linux-chromium-release:
  extends: .linux-chromium
  tags: [lb-linux-release]
  variables:
    SCCACHE_S3_KEY_PREFIX: sccache/release/

.linux-chromium-arm64:
  extends: .linux-chromium
  tags: [lb-linux-arm64-build]

.linux-chromium-arm64-release:
  extends: .linux-chromium-release
  tags: [lb-linux-arm64-release]

# Android: Chromium's own app (ChromePublic.apk, app ID app.littlebrowser.browser) with our privacy
# patches, on a Linux x64 build host, the only one Chromium builds Android on. One job per CPU:
# arm64 for phones, tablets and Arm Chromebooks, x64 for Intel and AMD Chromebooks (docs/design.md
# §7). Manual for now: nothing ships the APK yet.
.android:
  extends: .linux-chromium
  rules:
    - when: manual
      allow_failure: true
  script:
    - android/scripts/fetch.sh
    - android/build/src/build/install-build-deps.sh --android --no-prompt --no-chromeos-fonts
    - android/scripts/build.sh "$LB_ANDROID_CPU"
    # Chrome's Java classpath, for compiling our Java elsewhere (android/README.md): the same for
    # every CPU, so from the arm64 job only; never fails the job.
    - if [ "$LB_ANDROID_CPU" = arm64 ]; then python3 android/scripts/java_classpath.py android/build/src/out/arm64 java-classpath.tar.gz || true; fi
    # For reading crash stacks: libchrome.so's function symbols (the APK's copy has none) and
    # R8's map of the renamed Java classes; never fails the job.
    - android/build/src/third_party/llvm-build/Release+Asserts/bin/llvm-nm --defined-only -n -C android/build/src/out/$LB_ANDROID_CPU/lib.unstripped/libchrome.so | grep -E '^[0-9a-f]+ [tTwW] ' | gzip > libchrome-symbols.txt.gz || true
  artifacts:
    paths:
      - android/build/src/out/$LB_ANDROID_CPU/apks/ChromePublic.apk
      - android/build/src/out/$LB_ANDROID_CPU/apks/ChromePublic.apk.mapping
      - libchrome-symbols.txt.gz
      - java-classpath.tar.gz
    # A failed build's too: its tests may fail, and the symbols read a crash.
    when: always
    expire_in: 30 days

android-arm64:
  extends: .android
  variables:
    LB_ANDROID_CPU: arm64

android-x64:
  extends: .android
  variables:
    LB_ANDROID_CPU: x64

# linux-x64, linux-arm64, windows-x64: added when their platform recipes are wired up
# (desktop/README.md); they also get a merge_request_event rule.

# ------------------------------------------------------------------ package, sign, publish
# A tag builds and signs; the signed files are the internal test build (pipeline artifacts).
# Each platform and architecture has its own chain (build -> package -> publish -> release), and
# each step needs only the one before it in its chain, so a build is published as soon as it is
# ready, hours before a slower one. After internal testing, a person runs that build's manual
# `publish-<platform>-<arch>` job: it puts the same file on downloads.littlebrowser.app, lists it
# in releases.json, which the website reads, and offers it in that architecture's update feed.
# A release's first published build sets its notes and whether it is a security release: on that
# job, set LB_SECURITY_RELEASE=1 or 0 to say which (unset: a new Chromium version is one), and
# LB_RELEASE_NOTES to replace the commits' Release-note lines, with the notes separated by "|"
# (the form for running a job takes one line). A later build's job joins the release as it is,
# and stops if either is set.

# Signs and packages its architecture's build, on the same Mac (one runner per architecture, so
# the same build directory). Developer ID signature, notarised and stapled, with the signing
# material from Secrets Manager: on our own Macs through LB_MACOS_SIGNING_ROLE_ARN, which only
# v* tag jobs can assume, with this job's GitLab ID token; on the EC2 Mac through its instance
# role. While those secrets are empty, an ad-hoc signature, and macOS asks people to confirm the
# first launch. The release version turns on the updater and goes into the app's bundle version.
.macos-package:
  stage: package
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+\.\d+-\d+$/
  variables:
    GIT_STRATEGY: none           # keep the build job's tree; a checkout would clean out the
                                 # ignored build/ folder
  id_tokens:
    LB_AWS_ID_TOKEN:
      aud: sts.amazonaws.com
  before_script:
    - |
      if [ "$LB_MACOS_HOST" = local ]; then
        export AWS_ROLE_ARN="$LB_MACOS_SIGNING_ROLE_ARN" AWS_ROLE_SESSION_NAME="gitlab-$CI_JOB_ID"
        export AWS_WEB_IDENTITY_TOKEN_FILE="$CI_BUILDS_DIR/.aws-id-token-$CI_JOB_ID"
        (umask 077 && printf '%s' "$LB_AWS_ID_TOKEN" > "$AWS_WEB_IDENTITY_TOKEN_FILE")
      fi
  script:
    - desktop/scripts/package-macos.sh --arch "$LB_ARCH" --release "${CI_COMMIT_TAG#v}"
  after_script:
    - rm -f "$CI_BUILDS_DIR/.aws-id-token-$CI_JOB_ID"
  artifacts:
    expire_in: 30 days           # internal testing happens on these; publish promotes them as-is

macos-arm64-package:
  extends: .macos-package
  tags: [lb-macos-arm64]
  needs: [macos-arm64]
  variables:
    LB_ARCH: arm64
  artifacts:                     # .update.json: the update's signature
    paths: [desktop/build/LittleBrowser-macos-arm64.dmg, desktop/build/LittleBrowser-macos-arm64.update.json]

macos-x64-package:
  extends: .macos-package
  tags: [lb-macos-x64]
  needs: [macos-x64]
  variables:
    LB_ARCH: x64
  artifacts:
    paths: [desktop/build/LittleBrowser-macos-x64.dmg, desktop/build/LittleBrowser-macos-x64.update.json]

.aws:
  tags: [lb-linux-protected]     # release role: site and downloads buckets
  image:
    name: public.ecr.aws/aws-cli/aws-cli:2.27.50
    entrypoint: [""]

# One per build, needing only its own package job; LB_ARCH names the disk image to publish.
.publish:
  extends: .aws
  stage: publish
  resource_group: downloads      # one releases.json writer at a time
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+\.\d+-\d+$/
      when: manual               # a person publishes after internal testing; nothing is rebuilt
  variables:
    GIT_DEPTH: 0                 # the release notes read the commits since the last release
    GIT_FETCH_EXTRA_FLAGS: --tags --prune --quiet   # and need its tag
  before_script:
    - yum install -y -q jq python3 git
  script:
    - desktop/scripts/publish-release.sh "${CI_COMMIT_TAG#v}" "desktop/build/LittleBrowser-macos-$LB_ARCH.dmg"

publish-macos-arm64:
  extends: .publish
  needs: [macos-arm64-package]
  variables:
    LB_ARCH: arm64

publish-macos-x64:
  extends: .publish
  needs: [macos-x64-package]
  variables:
    LB_ARCH: x64

# GitLab's own record of the release, once a build is public: the first build's job creates it,
# each later one updates it, with the notes and the builds out so far from the live
# releases.json (desktop/scripts/gitlab_release.py), so whichever runs last lists them all.
.release:
  stage: publish
  tags: [lb-linux]
  image: python:3-slim
  resource_group: gitlab-release
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+\.\d+-\d+$/
  variables:
    GIT_DEPTH: 1
  script:
    # LB_BUILD: the build its publish job put out, which releases.json must list first.
    - python3 -I desktop/scripts/gitlab_release.py "$CI_COMMIT_TAG" "$LB_BUILD" "$LB_DOWNLOADS_URL/releases.json"

release-macos-arm64:
  extends: .release
  needs: [publish-macos-arm64]
  variables:
    LB_BUILD: macos-arm64

release-macos-x64:
  extends: .release
  needs: [publish-macos-x64]
  variables:
    LB_BUILD: macos-x64

# Scheduled, daily: downloads and updates of each release file, counted from the downloads
# host's logs (no IP addresses or user agents in them), published as stats.json for the website.
download-stats:
  extends: .aws
  stage: publish
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $LB_SCHEDULE == "download-stats"
  before_script:
    - yum install -y -q python3
  script:
    - desktop/scripts/download-stats.sh

# ------------------------------------------------------------------ website
# littlebrowser.app from site/, on main only: when site/ changes, or from "Run pipeline" (or the
# API) on main.

site:
  extends: .aws
  stage: publish
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"
      changes: [site/**/*]
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE =~ /^(web|api)$/
  script:
    - desktop/scripts/deploy-site.sh
